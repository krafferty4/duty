<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eorzean Duty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="https://img2.finalfantasyxiv.com/f/433cdc54903ed39b5d69434f04a85f8f_57ae9ee5592123dd79c8912bf768cf99fc0.jpg?1790176797">
<style>
  :root{
    --bg-0: #0b0d16;
    --panel: #161927;
    --panel-edge: rgba(201,168,106,0.28);
    --gold: #c9a86a;
    --gold-bright: #e7cd94;
    --crystal: #6fc3dd;
    --text: #dcdeea;
    --text-dim: #8d90a6;
    --text-faint: #5e6178;
    --danger: #d17b7b;
    --focus: #e7cd94;

    --pr-poor: #71748a;
    --pr-common: #d9dbe8;
    --pr-uncommon: #7bc47f;
    --pr-rare: #5b9bd9;
    --pr-epic: #ab7fe6;
    --pr-legendary: #e0a840;
  }

  *{ box-sizing: border-box; }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }

  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(148,132,207,0.12), transparent 60%),
      radial-gradient(ellipse 800px 600px at 100% 0%, rgba(111,195,221,0.10), transparent 55%),
      var(--bg-0);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }

  .app{ max-width: 720px; margin: 0 auto; padding: 56px 24px 80px; }

  header{
    display:flex; align-items: flex-end; justify-content: space-between; gap: 24px;
    margin-bottom: 30px; padding-bottom: 24px; border-bottom: 1px solid rgba(201,168,106,0.18); flex-wrap: wrap;
  }

  .title-block h1{
    font-family: 'Cinzel', serif; font-weight: 600; font-size: clamp(28px, 4.2vw, 40px);
    letter-spacing: 0.01em; margin: 0 0 6px 0;
    background: linear-gradient(100deg, var(--gold) 0%, var(--gold-bright) 35%, var(--crystal) 55%, var(--gold) 80%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 2.8s ease-out 1;
  }
  @keyframes shimmer{ from{ background-position: 100% 0; } to{ background-position: 0% 0; } }
  .title-block p{ margin:0; color: var(--text-dim); font-size: 14.5px; max-width: 46ch; line-height: 1.5; }
  .today{ font-size: 13px; color: var(--text-faint); text-align: right; white-space: nowrap; }

  @media (max-width: 600px){
    .app{ padding: 40px 16px 64px; }
    header{ align-items: flex-start; }
    .today{ text-align:left; }
  }

  .panel{
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 3px;
    padding: 22px 22px 18px; position: relative;
  }
  .panel::before{
    content:""; position:absolute; top: -1px; left: -1px; width: 9px; height: 9px;
    background: var(--gold); transform: rotate(45deg); border-radius: 1px;
  }

  .panel-head{ display:flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .panel-head h2{ font-family: 'Cinzel', serif; font-size: 17px; font-weight: 600; margin: 0; letter-spacing: 0.03em; }
  .panel-head .count{ color: var(--text-faint); font-size: 12.5px; margin-left: 8px; font-family: 'Inter', sans-serif; font-weight: 400; }

  .head-actions{ display:flex; gap: 16px; }
  .reset-btn{ background:none; border:none; color: var(--text-dim); font-size: 12.5px; cursor:pointer; padding: 2px 0; display:flex; align-items:center; gap:5px; }
  .reset-btn:hover{ color: var(--gold-bright); }
  .reset-btn svg{ width:12px; height:12px; }

  .list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap: 1px; }

  .row{ display:flex; flex-direction: column; padding: 7px 4px; border-radius: 2px; animation: rise 0.2s ease-out; border-top: 2px solid transparent; border-bottom: 2px solid transparent; }
  @keyframes rise{ from{ opacity:0; transform: translateY(4px); } to{ opacity:1; transform: translateY(0); } }
  .row:hover{ background: rgba(255,255,255,0.02); }
  .row.dragging{ opacity: 0.4; }
  .row.drag-over-top{ border-top-color: var(--gold-bright); }
  .row.drag-over-bottom{ border-bottom-color: var(--gold-bright); }
  .row-main{ display:flex; align-items:center; gap: 6px; }

  .handle{
    display:flex; align-items:center; justify-content:center; width:16px; height:20px; flex-shrink:0;
    color: var(--text-faint); opacity: 0.35; cursor: grab; padding:0; background:none; border:none;
  }
  .handle svg{ width:14px; height:14px; }
  .row:hover .handle{ opacity: 0.9; }
  .handle:active{ cursor: grabbing; }

  .chk{
    appearance:none; -webkit-appearance:none; width: 16px; height:16px; min-width:16px;
    border: 1.5px solid var(--text-faint); border-radius: 2px;
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
    background: transparent; flex-shrink:0;
  }
  .chk:hover{ border-color: var(--gold-bright); }
  .chk:checked{ background: var(--pr-poor); border-color: var(--pr-poor); }
  .chk:checked::after{
    content:""; position:absolute; left:4px; top:1px; width:4px; height:8px;
    border: solid var(--bg-0); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .chk:focus-visible{ outline: 2px solid var(--focus); outline-offset:2px; }
  .chk.sub{ width:14px; height:14px; min-width:14px; }

  .row-text{ flex:1; font-size: 14px; line-height:1.4; word-break: break-word; cursor: text; padding: 2px 0; }
  .row-text.done{ text-decoration: line-through; }
  .row-text.sub{ font-size: 13px; }

  .pill{ font-size: 10.5px; padding: 1px 7px; border-radius: 8px; border: 1px solid; flex-shrink:0; }
  .pill.daily{ color: var(--crystal); border-color: rgba(111,195,221,0.4); background: rgba(111,195,221,0.08); }
  .pill.weekly{ color: var(--gold); border-color: rgba(201,168,106,0.4); background: rgba(201,168,106,0.08); }

  .edit-form{ display:flex; align-items:center; gap: 8px; width:100%; }
  .edit-toolkit{ display:flex; align-items:center; gap: 12px; flex-wrap: wrap; width:100%; margin-top: 8px; padding-left: 22px; }
  .edit-input{
    flex:1; min-width: 140px; background: rgba(255,255,255,0.05); border: 1px solid var(--focus);
    border-radius: 2px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; padding: 5px 8px;
  }
  .priority-picker{ display:flex; align-items:center; gap: 6px; }
  .swatch{
    width: 14px; height:14px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.35);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset; cursor:pointer; padding:0;
  }
  .swatch.active{ box-shadow: 0 0 0 2px var(--bg-0), 0 0 0 3px var(--focus); }
  .edit-select{
    background: var(--bg-0); border: 1px solid rgba(255,255,255,0.15); color: var(--text);
    border-radius: 2px; font-family: 'Inter', sans-serif; font-size: 12.5px; padding: 5px 6px;
  }
  .edit-toolkit button{
    background:none; border: 1px solid rgba(255,255,255,0.15); color: var(--text-dim);
    border-radius: 2px; font-size: 12.5px; padding: 5px 10px; cursor:pointer;
  }
  .edit-toolkit button.primary{ border-color: var(--gold); color: var(--gold-bright); }
  .edit-toolkit button:hover{ color: var(--text); }

  .row-actions{ display:flex; gap:2px; opacity: 0; transition: opacity 0.12s ease; margin-left: auto; }
  .row:hover .row-actions, .row:focus-within .row-actions{ opacity: 1; }

  .icon-btn{ background:none; border:none; color: var(--text-faint); cursor:pointer; padding: 4px; display:flex; border-radius: 2px; }
  .icon-btn:hover{ color: var(--text); }
  .icon-btn.danger:hover{ color: var(--danger); }
  .icon-btn svg{ width:14px; height:14px; }
  .icon-btn:focus-visible{ outline: 2px solid var(--focus); outline-offset:1px; }

  .empty{ color: var(--text-faint); font-size: 13.5px; padding: 10px 4px 18px; }

  .show-hidden{ background:none; border:none; color: var(--text-faint); font-size: 12px; text-align:left; padding: 10px 4px 2px; cursor:pointer; }
  .show-hidden:hover{ color: var(--text-dim); text-decoration: underline; }

  .divider-row{ display:flex; align-items:center; gap: 10px; padding: 10px 4px 8px; }
  .divider-toggle{
    background:none; border:none; color: var(--text-faint); cursor:pointer; padding: 2px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; transition: transform 0.15s ease;
  }
  .divider-toggle svg{ width: 13px; height: 13px; }
  .divider-toggle:hover{ color: var(--text); }
  .divider-toggle.collapsed{ transform: rotate(-90deg); }
  .divider-line{ flex:1; height:1px; background: rgba(255,255,255,0.08); }
  .divider-label{ font-size: 11.5px; color: var(--text-faint); white-space: nowrap; }

  .sublist{ list-style:none; margin: 2px 0 2px 0; padding: 0 0 0 24px; border-left: 1px solid rgba(255,255,255,0.06); }
  .subrow{ display:flex; align-items:center; gap:8px; padding: 5px 4px; }

  .add-sub-row{ display:flex; gap:6px; margin: 2px 0 4px 24px; }
  .add-sub-row input{
    flex:1; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 2px; color: var(--text); font-family:'Inter',sans-serif; font-size: 12.5px; padding: 6px 8px;
  }
  .add-sub-row input:focus{ outline:none; border-color: var(--gold); }
  .add-sub-row button{ background:none; border:none; color: var(--text-faint); cursor:pointer; padding: 2px 4px; }
  .add-sub-row button:hover{ color: var(--text); }

  .add-row{ display:flex; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.05); }
  .add-row input{
    flex:1; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 2px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 13.5px; padding: 9px 10px;
  }
  .add-row input::placeholder{ color: var(--text-faint); }
  .add-row input:focus{ outline:none; border-color: var(--gold); }
  .add-row button{
    background: transparent; border: 1px solid var(--gold); color: var(--gold-bright);
    border-radius: 2px; padding: 0 14px; font-size: 13px; font-weight: 500; cursor:pointer;
  }
  .add-row button:hover{ background: var(--gold); color: var(--bg-0); }

  footer{ text-align:center; color: var(--text-faint); font-size: 12px; margin-top: 34px; }

  @media (prefers-reduced-motion: reduce){ .title-block h1{ animation: none; } .row{ animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-block">
      <h1>Eorzean Duty</h1>
      <p>Goals for the Source, Shard and beyond.</p>
    </div>
    <div class="today" id="today"></div>
	<img src="https://img.finalfantasyxiv.com/t/6b35db12cb2673f37625e688a33e5a98aa462b60.png?1789988411" width=675>
  </header>

  <div class="panel">
    <div class="panel-head">
      <h2>Missions<span class="count" id="count"></span></h2>
      <div class="head-actions">
        <button class="reset-btn" data-reset="daily"></button>
        <button class="reset-btn" data-reset="weekly"></button>
      </div>
    </div>
    <ul class="list" id="list"></ul>
    <button class="show-hidden" id="showHiddenBtn" style="display:none;"></button>
    <div class="add-row">
      <input type="text" placeholder="Post a mission" id="addInput" maxlength="80">
      <button id="addBtn">Add</button>
    </div>
  </div>

  <footer>Saved locally on this device. Click a mission's text to edit it, set its priority and give it a reset.</footer>
</div>

<script>
(function(){
  var STORAGE_KEY = 'eorzea-checklist-v3';
  var COLLAPSE_KEY = 'eorzea-recurring-collapsed';

  var ICONS = {
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17.9 17.9 0 0 1-3.4 4.3M6.6 6.6C4 8.3 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4.2-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>',
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11A8 8 0 0 0 6.3 6.3L4 8.6"/><path d="M4 4v4.6h4.6"/><path d="M4 13a8 8 0 0 0 13.7 4.7L20 15.4"/><path d="M20 20v-4.6h-4.6"/></svg>',
    addSub: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4v7a2 2 0 0 0 2 2h9"/><path d="M13 10l3 3-3 3"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    handle: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
    chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>'
  };

  var PRIORITY_ORDER = ['poor','common','uncommon','rare','epic','legendary'];
  var PRIORITY_META = {
    poor:       { color: 'var(--pr-poor)',      label: 'Junk' },
    common:     { color: 'var(--pr-common)',    label: 'Common' },
    uncommon:   { color: 'var(--pr-uncommon)',  label: 'Uncommon' },
    rare:       { color: 'var(--pr-rare)',      label: 'Rare' },
    epic:       { color: 'var(--pr-epic)',      label: 'Epic' },
    legendary:  { color: 'var(--pr-legendary)', label: 'Legendary' }
  };
  var DONE_COLOR = 'var(--pr-poor)';

  function uid(){ return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }

  function makeItem(text, resetType){
    return { id: uid(), text: text, done: false, hidden: false, priority: 'common', resetType: resetType || '', subitems: [] };
  }

  function defaultState(){
    return {
      items: [
        makeItem('Tomestone cap', 'weekly'),
        makeItem('Challenge log', 'weekly'),
        makeItem('Squadron mission', 'weekly'),
        makeItem('Wandering Trails', 'weekly'),
        makeItem('Northern Horn', ''),
        makeItem('Mogpendium', ''),
        makeItem('Shared FATE', ''),
        makeItem('Level Beastmaster', ''),
        makeItem('Crucible board', ''),
        makeItem('Scholarite questline', ''),
        makeItem('Mandervillain questline', '')
      ]
    };
  }

  function migrateItem(i, resetType){
    if(!i.priority || !PRIORITY_META[i.priority]) i.priority = 'common';
    if(!Array.isArray(i.subitems)) i.subitems = [];
    i.subitems.forEach(function(s){ if(typeof s.done !== 'boolean') s.done = false; });
    if(typeof i.resetType !== 'string') i.resetType = resetType || '';
    return i;
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);

      var v2raw = localStorage.getItem('eorzea-checklist-v2');
      if(v2raw){
        var v2 = JSON.parse(v2raw);
        var flat = [];
        ['weekly','daily','ongoing','milestones'].forEach(function(cat){
          var rt = (cat === 'daily' || cat === 'weekly') ? cat : '';
          (v2[cat] || []).forEach(function(i){ flat.push(migrateItem(i, rt)); });
        });
        if(flat.length) return { items: flat };
      }
      return defaultState();
    }catch(e){ return defaultState(); }
  }

  var state = loadState();
  if(!Array.isArray(state.items)) state.items = [];
  state.items = state.items.map(function(i){ return migrateItem(i, ''); });

  var showHidden = false;
  var editingId = null;
  var editingSub = null;
  var draggedId = null;
  var recurringCollapsed = false;
  try{ recurringCollapsed = localStorage.getItem(COLLAPSE_KEY) === '1'; }catch(e){}

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error('Could not save checklist', e); }
  }

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderToday(){
    var el = document.getElementById('today');
    var d = new Date();
    el.textContent = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }

  function renderResetButtons(){
    document.querySelector('[data-reset="daily"]').innerHTML = ICONS.refresh + 'Reset day';
    document.querySelector('[data-reset="weekly"]').innerHTML = ICONS.refresh + 'Reset week';
  }

  function isOffscreen(item){
    return item.hidden || (item.done && !item.resetType);
  }

  function groupOf(item){ return item.resetType || 'none'; }

  function findItem(id){ return state.items.filter(function(i){ return i.id === id; })[0]; }

  function editFormTemplate(item){
    var swatches = PRIORITY_ORDER.map(function(k){
      var m = PRIORITY_META[k];
      return '<button class="swatch' + (item.priority === k ? ' active' : '') + '" data-setpriority="' + item.id + '" data-tier="' + k + '" style="background:' + m.color + '" title="' + m.label + '"></button>';
    }).join('');
    return (
      '<div class="edit-form">' +
        '<input type="text" class="edit-input" id="editText" value="' + escapeHtml(item.text) + '" maxlength="80">' +
      '</div>' +
      '<div class="edit-toolkit">' +
        '<div class="priority-picker">' + swatches + '</div>' +
        '<select class="edit-select" id="editType">' +
          '<option value=""' + (item.resetType === '' ? ' selected' : '') + '>No reset</option>' +
          '<option value="daily"' + (item.resetType === 'daily' ? ' selected' : '') + '>Daily reset</option>' +
          '<option value="weekly"' + (item.resetType === 'weekly' ? ' selected' : '') + '>Weekly reset</option>' +
        '</select>' +
        '<button class="primary" data-editsave="' + item.id + '">Save</button>' +
        '<button data-editcancel="' + item.id + '">Cancel</button>' +
      '</div>'
    );
  }

  function rowTemplate(item){
    if(editingId === item.id){
      return '<li class="row" data-id="' + item.id + '">' + editFormTemplate(item) + '</li>';
    }
    var textColor = item.done ? DONE_COLOR : PRIORITY_META[item.priority].color;
    var pill = item.resetType ? '<span class="pill ' + item.resetType + '">' + (item.resetType === 'daily' ? 'Daily' : 'Weekly') + '</span>' : '';
    var subHtml = '';
    if(item.subitems.length){
      subHtml += '<ul class="sublist">' + item.subitems.map(function(s){ return subRowTemplate(s, item); }).join('') + '</ul>';
    }
    return (
      '<li class="row" data-id="' + item.id + '">' +
        '<div class="row-main">' +
          '<button class="handle" data-draghandle="' + item.id + '" draggable="true" title="Drag to reorder">' + ICONS.handle + '</button>' +
          '<input type="checkbox" class="chk" ' + (item.done ? 'checked' : '') + ' data-toggle="' + item.id + '">' +
          '<span class="row-text' + (item.done ? ' done' : '') + '" data-text="' + item.id + '" style="color:' + textColor + '">' + escapeHtml(item.text) + '</span>' +
          pill +
          '<span class="row-actions">' +
            '<button class="icon-btn" data-addsub="' + item.id + '" title="Add sub-task">' + ICONS.addSub + '</button>' +
            '<button class="icon-btn" data-hide="' + item.id + '" title="' + (item.hidden ? 'Unhide' : 'Hide') + '">' + (item.hidden ? ICONS.eye : ICONS.eyeOff) + '</button>' +
            '<button class="icon-btn danger" data-delete="' + item.id + '" title="Delete">' + ICONS.trash + '</button>' +
          '</span>' +
        '</div>' +
        '<div class="add-sub-row" data-addsubrow="' + item.id + '" style="display:none;">' +
          '<input type="text" placeholder="Add a step" data-subinput="' + item.id + '" maxlength="80">' +
          '<button data-subadd="' + item.id + '" title="Add">' + ICONS.addSub + '</button>' +
          '<button data-subclose="' + item.id + '" title="Close">' + ICONS.close + '</button>' +
        '</div>' +
        subHtml +
      '</li>'
    );
  }

  function subRowTemplate(sub, parent){
    if(editingSub && editingSub.subId === sub.id){
      return (
        '<li class="subrow" data-subid="' + sub.id + '">' +
          '<div class="edit-form">' +
            '<input type="text" class="edit-input" id="editSubText" value="' + escapeHtml(sub.text) + '" maxlength="80">' +
            '<button class="primary" data-subeditsave="' + sub.id + '" data-subeditparent="' + parent.id + '">Save</button>' +
            '<button data-subeditcancel="' + sub.id + '">Cancel</button>' +
          '</div>' +
        '</li>'
      );
    }
    return (
      '<li class="subrow" data-subid="' + sub.id + '" data-parent="' + parent.id + '">' +
        '<input type="checkbox" class="chk sub" ' + (sub.done ? 'checked' : '') + ' data-subtoggle="' + sub.id + '" data-subparent="' + parent.id + '">' +
        '<span class="row-text sub' + (sub.done ? ' done' : '') + '" data-subtext="' + sub.id + '" data-subtextparent="' + parent.id + '" style="color:' + (sub.done ? DONE_COLOR : 'var(--text)') + '">' + escapeHtml(sub.text) + '</span>' +
        '<span class="row-actions">' +
          '<button class="icon-btn danger" data-subdelete="' + sub.id + '" data-subdeleteparent="' + parent.id + '" title="Delete">' + ICONS.trash + '</button>' +
        '</span>' +
      '</li>'
    );
  }

  function dividerTemplate(hiddenCount){
    return (
      '<li class="divider-row">' +
        '<button class="divider-toggle' + (recurringCollapsed ? ' collapsed' : '') + '" data-recurring-toggle title="' + (recurringCollapsed ? 'Show' : 'Hide') + ' weekly and daily missions">' + ICONS.chevron + '</button>' +
        '<span class="divider-line"></span>' +
        '<span class="divider-label">' + (recurringCollapsed ? hiddenCount + ' hidden' : 'Weekly and daily') + '</span>' +
      '</li>'
    );
  }

  function render(){
    var items = state.items;
    var listEl = document.getElementById('list');
    var countEl = document.getElementById('count');
    var hiddenBtn = document.getElementById('showHiddenBtn');

    var visible = items.filter(function(i){ return showHidden || editingId === i.id || !isOffscreen(i); });
    var offCount = items.filter(function(i){ return isOffscreen(i); }).length;
    var openCount = items.filter(function(i){ return !i.done; }).length;

    countEl.textContent = items.length ? (openCount + ' open') : '';

    var weeklyItems = visible.filter(function(i){ return i.resetType === 'weekly'; });
    var dailyItems = visible.filter(function(i){ return i.resetType === 'daily'; });
    var otherItems = visible.filter(function(i){ return !i.resetType; });
    var recurring = weeklyItems.concat(dailyItems);

    var html = '';
    if(recurring.length){
      if(!recurringCollapsed){ html += recurring.map(rowTemplate).join(''); }
      html += dividerTemplate(recurring.length);
    }
    html += otherItems.map(rowTemplate).join('');

    listEl.innerHTML = html || '<li class="empty">No missions yet. Post one below.</li>';

    if(offCount > 0){
      hiddenBtn.style.display = 'block';
      hiddenBtn.textContent = showHidden ? 'Hide completed and hidden again' : 'Show hidden (' + offCount + ')';
    } else {
      hiddenBtn.style.display = 'none';
    }

    if(editingId){
      var input = document.getElementById('editText');
      if(input){ input.focus(); input.select(); }
    }
    if(editingSub){
      var subInput = document.getElementById('editSubText');
      if(subInput){ subInput.focus(); subInput.select(); }
    }
  }

  function addItem(){
    var input = document.getElementById('addInput');
    var text = input.value.trim();
    if(!text) return;
    state.items.push(makeItem(text, ''));
    input.value = '';
    save(); render();
    input.focus();
  }

  function reorder(draggedItemId, targetId, insertAfter){
    var arr = state.items;
    var idxDragged = arr.findIndex(function(i){ return i.id === draggedItemId; });
    if(idxDragged === -1) return;
    var draggedItem = arr[idxDragged];
    arr.splice(idxDragged, 1);
    var idxTarget = arr.findIndex(function(i){ return i.id === targetId; });
    if(idxTarget === -1){
      arr.push(draggedItem);
    } else {
      arr.splice(insertAfter ? idxTarget + 1 : idxTarget, 0, draggedItem);
    }
    save(); render();
  }

  function clearDragVisuals(){
    document.querySelectorAll('.dragging').forEach(function(el){ el.classList.remove('dragging'); });
    document.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(function(el){ el.classList.remove('drag-over-top','drag-over-bottom'); });
  }

  function bindEvents(){
    document.getElementById('addBtn').addEventListener('click', addItem);
    document.getElementById('addInput').addEventListener('keydown', function(e){ if(e.key === 'Enter') addItem(); });

    document.querySelector('[data-reset="daily"]').addEventListener('click', function(){
      state.items.forEach(function(i){ if(i.resetType === 'daily') i.done = false; });
      save(); render();
    });
    document.querySelector('[data-reset="weekly"]').addEventListener('click', function(){
      state.items.forEach(function(i){ if(i.resetType === 'weekly') i.done = false; });
      save(); render();
    });

    document.getElementById('showHiddenBtn').addEventListener('click', function(){
      showHidden = !showHidden; render();
    });

    var listEl = document.getElementById('list');

    listEl.addEventListener('dragstart', function(e){
      var handle = e.target.closest('[data-draghandle]');
      if(!handle){ e.preventDefault(); return; }
      draggedId = handle.getAttribute('data-draghandle');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', draggedId); }catch(err){}
      var row = handle.closest('.row');
      requestAnimationFrame(function(){ if(row) row.classList.add('dragging'); });
    });

    listEl.addEventListener('dragover', function(e){
      var row = e.target.closest('.row');
      if(!row || !draggedId) return;
      var draggedItem = findItem(draggedId);
      var targetItem = findItem(row.getAttribute('data-id'));
      if(!draggedItem || !targetItem || groupOf(draggedItem) !== groupOf(targetItem)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      var rect = row.getBoundingClientRect();
      var before = (e.clientY - rect.top) < rect.height / 2;
      document.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(function(el){ el.classList.remove('drag-over-top','drag-over-bottom'); });
      row.classList.add(before ? 'drag-over-top' : 'drag-over-bottom');
    });

    listEl.addEventListener('drop', function(e){
      var row = e.target.closest('.row');
      e.preventDefault();
      if(!row || !draggedId){ clearDragVisuals(); draggedId = null; return; }
      var targetId = row.getAttribute('data-id');
      var draggedItem = findItem(draggedId);
      var targetItem = findItem(targetId);
      if(targetId && targetId !== draggedId && draggedItem && targetItem && groupOf(draggedItem) === groupOf(targetItem)){
        var rect = row.getBoundingClientRect();
        var insertAfter = (e.clientY - rect.top) >= rect.height / 2;
        reorder(draggedId, targetId, insertAfter);
      }
      clearDragVisuals();
      draggedId = null;
    });

    listEl.addEventListener('dragend', function(){ clearDragVisuals(); draggedId = null; });

    listEl.addEventListener('click', function(e){
      var t = e.target;

      var toggleBtn = t.closest('[data-recurring-toggle]');
      if(toggleBtn){
        recurringCollapsed = !recurringCollapsed;
        try{ localStorage.setItem(COLLAPSE_KEY, recurringCollapsed ? '1' : '0'); }catch(err){}
        render();
        return;
      }

      var textSpan = t.closest('[data-text]');
      if(textSpan && editingId !== textSpan.getAttribute('data-text')){
        editingId = textSpan.getAttribute('data-text');
        render(); return;
      }

      var subTextSpan = t.closest('[data-subtext]');
      if(subTextSpan){
        editingSub = { subId: subTextSpan.getAttribute('data-subtext'), parentId: subTextSpan.getAttribute('data-subtextparent') };
        render(); return;
      }

      var setPriorityBtn = t.closest('[data-setpriority]');
      if(setPriorityBtn){
        var pItem = findItem(setPriorityBtn.getAttribute('data-setpriority'));
        if(pItem){ pItem.priority = setPriorityBtn.getAttribute('data-tier'); save(); render(); }
        return;
      }

      var saveBtn = t.closest('[data-editsave]');
      if(saveBtn){
        var sid = saveBtn.getAttribute('data-editsave');
        var sitem = findItem(sid);
        var newText = document.getElementById('editText').value.trim();
        var newType = document.getElementById('editType').value;
        if(newText) sitem.text = newText;
        sitem.resetType = newType;
        editingId = null;
        save(); render();
        return;
      }
      var cancelBtn = t.closest('[data-editcancel]');
      if(cancelBtn){ editingId = null; render(); return; }

      var addSubBtn = t.closest('[data-addsub]');
      if(addSubBtn){
        var aid = addSubBtn.getAttribute('data-addsub');
        var row2 = document.querySelector('[data-addsubrow="' + aid + '"]');
        row2.style.display = row2.style.display === 'none' ? 'flex' : 'none';
        if(row2.style.display === 'flex'){ row2.querySelector('input').focus(); }
        return;
      }
      var subCloseBtn = t.closest('[data-subclose]');
      if(subCloseBtn){
        document.querySelector('[data-addsubrow="' + subCloseBtn.getAttribute('data-subclose') + '"]').style.display = 'none';
        return;
      }
      var subAddBtn = t.closest('[data-subadd]');
      if(subAddBtn){
        var pid = subAddBtn.getAttribute('data-subadd');
        var subInputEl = document.querySelector('[data-subinput="' + pid + '"]');
        var txt = subInputEl.value.trim();
        if(txt){
          var parentItem = findItem(pid);
          parentItem.subitems.push({ id: uid(), text: txt, done: false });
          save(); render();
          var reopened = document.querySelector('[data-addsubrow="' + pid + '"]');
          if(reopened){ reopened.style.display = 'flex'; reopened.querySelector('input').focus(); }
        }
        return;
      }

      var hideBtn = t.closest('[data-hide]');
      if(hideBtn){
        var hitem = findItem(hideBtn.getAttribute('data-hide'));
        if(hitem){ hitem.hidden = !hitem.hidden; save(); render(); }
        return;
      }

      var delBtn = t.closest('[data-delete]');
      if(delBtn){
        var did = delBtn.getAttribute('data-delete');
        state.items = state.items.filter(function(i){ return i.id !== did; });
        save(); render();
        return;
      }

      var subEditSaveBtn = t.closest('[data-subeditsave]');
      if(subEditSaveBtn){
        var epid = subEditSaveBtn.getAttribute('data-subeditparent');
        var esid = subEditSaveBtn.getAttribute('data-subeditsave');
        var eparent = findItem(epid);
        var esub = eparent.subitems.filter(function(s){ return s.id === esid; })[0];
        var newSubText = document.getElementById('editSubText').value.trim();
        if(newSubText) esub.text = newSubText;
        editingSub = null;
        save(); render();
        return;
      }
      var subEditCancelBtn = t.closest('[data-subeditcancel]');
      if(subEditCancelBtn){ editingSub = null; render(); return; }

      var subDelBtn = t.closest('[data-subdelete]');
      if(subDelBtn){
        var sPid = subDelBtn.getAttribute('data-subdeleteparent');
        var sId = subDelBtn.getAttribute('data-subdelete');
        var sParent = findItem(sPid);
        sParent.subitems = sParent.subitems.filter(function(s){ return s.id !== sId; });
        save(); render();
        return;
      }
    });

    listEl.addEventListener('change', function(e){
      var chk = e.target.closest('[data-toggle]');
      if(chk){
        var item = findItem(chk.getAttribute('data-toggle'));
        if(item){ item.done = chk.checked; save(); render(); }
        return;
      }
      var subChk = e.target.closest('[data-subtoggle]');
      if(subChk){
        var parent = findItem(subChk.getAttribute('data-subparent'));
        var sub = parent.subitems.filter(function(s){ return s.id === subChk.getAttribute('data-subtoggle'); })[0];
        if(sub){ sub.done = subChk.checked; save(); render(); }
      }
    });

    listEl.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        var subInput = e.target.closest('[data-subinput]');
        if(subInput){
          var btn = document.querySelector('[data-subadd="' + subInput.getAttribute('data-subinput') + '"]');
          if(btn) btn.click();
          return;
        }
        if(e.target.id === 'editText'){
          var saveBtn2 = document.querySelector('[data-editsave="' + editingId + '"]');
          if(saveBtn2) saveBtn2.click();
          return;
        }
        if(e.target.id === 'editSubText' && editingSub){
          var saveBtn3 = document.querySelector('[data-subeditsave="' + editingSub.subId + '"]');
          if(saveBtn3) saveBtn3.click();
        }
      }
      if(e.key === 'Escape'){
        if(editingId){ editingId = null; render(); }
        if(editingSub){ editingSub = null; render(); }
      }
    });
  }

  renderToday();
  renderResetButtons();
  render();
  bindEvents();
})();
</script>
</body>
</html>
